global:
  scrape_interval: 30s
scrape_configs:
  - job_name: node
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: postgres
    static_configs: [{targets: ['postgres-exporter:9187']}]
  - job_name: cadvisor
    static_configs: [{targets: ['cadvisor:8080']}]
  - job_name: django
    metrics_path: /metrics/internal/
    static_configs: [{targets: ['web:8000']}]
