{% extends 'base.html' %}
{% load static %}
{% block body %}
<div class="login-wrap">
  <div class="login-card auth-login-card">
    <div class="login-logo">
      <img src="{% static 'brand/promptmaster-logo-hq.png' %}" alt="PromptMaster">
    </div>

    <div class="auth-heading">
      <h1>Anmelden</h1>
      <p class="muted">Ein Zugang für PromptMaster, Kundenportal und netstyle Admin</p>
    </div>

    <form method="post" class="form auth-login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      {{ form.non_field_errors }}

      <label class="auth-field">
        <span>{{ form.email.label }}:</span>
        {{ form.email }}
      </label>
      {{ form.email.errors }}

      <label class="auth-field">
        <span>{{ form.password.label }}:</span>
        {{ form.password }}
      </label>
      {{ form.password.errors }}

      <button class="btn primary auth-submit" type="submit">Anmelden</button>
    </form>

    <div class="result-actions auth-login-actions">
      <a class="btn secondary" href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Noch kein Konto? Konto erstellen</a>
      <a class="btn secondary" href="{% url 'accounts:password_reset' %}">Passwort vergessen?</a>
    </div>
  </div>
</div>
{% endblock %}
