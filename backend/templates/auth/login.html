{% extends 'base.html' %}{% load static %}{% block body %}<div class="login-wrap"><div class="login-card"><div class="login-logo"><img src="{% static 'brand/promptmaster-logo-clean.svg' %}" alt="PromptMaster"></div><h1>Anmelden</h1><p class="muted">Ein Zugang für PromptMaster, Kundenportal und netstyle Admin</p><form method="post" class="form">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{{ form.as_p }}<button class="btn primary" type="submit">Anmelden</button></form><div class="result-actions"><a class="btn secondary" href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Noch kein Konto? Konto erstellen</a><a class="btn secondary" href="{% url 'accounts:password_reset' %}">Passwort vergessen?</a></div></div></div>{% endblock %}
