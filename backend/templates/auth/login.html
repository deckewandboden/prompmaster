{% extends 'base.html' %}
{% load static i18n %}
{% block body %}
<div class="login-wrap">
  <div class="login-card login-main-card">
    <div class="login-logo">
      <img src="{% static 'brand/promptfinisher-logo-hq.png' %}?v=20261011-logo1" alt="PROMPTFINISHER">
    </div>
    <h1>{% translate "Anmelden" %}</h1>
    <form method="post" class="form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {{ form.as_p }}
      <button class="btn primary" type="submit">{% translate "Anmelden" %}</button>
    </form>
    <div class="login-secondary-actions">
      <a class="btn secondary" href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">{% translate "Konto anlegen" %}</a>
      <a class="btn secondary" href="{% url 'accounts:password_reset' %}">{% translate "Passwort vergessen?" %}</a>
    </div>
  </div>
</div>
{% endblock %}
