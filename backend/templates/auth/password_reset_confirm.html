{% extends 'base.html' %}{% load static %}{% block body %}
<div class="login-wrap"><div class="login-card">
  <div class="login-logo"><img src="{% static 'brand/promptmaster-logo-reference.png' %}" width="239" height="47" alt="PromptMaster by netstyle"></div>
  <h1>Neues Passwort</h1>

  <form method="post" class="form">{% csrf_token %}{{ form.as_p }}<button class="btn primary" type="submit">Passwort speichern</button></form>
</div></div>
{% endblock %}
