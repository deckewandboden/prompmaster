{% extends 'base.html' %}{% load static i18n %}{% block body %}
<div class="login-wrap"><div class="login-card">
  <div class="login-logo"><img src="{% static 'brand/promptfinisher-logo-hq.png' %}" width="239" height="47" alt="PROMPTFINISHER by netstyle"></div>
  <h1>{% translate "Neues Passwort" %}</h1>
  <p class="muted">{% translate "Legen Sie ein neues Passwort für Ihr PROMPTFINISHER-Konto fest." %}</p>
  <form method="post" class="form">{% csrf_token %}{{ form.as_p }}<button class="btn primary" type="submit">{% translate "Passwort speichern" %}</button></form>
</div></div>
{% endblock %}
