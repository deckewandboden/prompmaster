{% load i18n %}
{% get_current_language as current_language %}
{% get_available_languages as available_languages %}
<div
  class="language-switcher"
  data-language-switcher
  data-action="{% url 'accounts:set_ui_language' %}"
  data-next="{{ request.get_full_path }}"
  aria-label="{% translate 'Sprache auswählen' %}"
>
  <label>
    <span>{% translate "Sprache" %}</span>
    <select name="language" data-language-select aria-label="{% translate 'Sprache' %}">
      {% for code,name in available_languages %}
        <option value="{{ code }}" {% if code == current_language %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <noscript>
    <span>
      {% for code,name in available_languages %}
        <a href="{% url 'accounts:set_ui_language' %}?language={{ code|urlencode }}&next={{ request.get_full_path|urlencode }}">{{ name }}</a>{% if not forloop.last %} · {% endif %}
      {% endfor %}
    </span>
  </noscript>
</div>
