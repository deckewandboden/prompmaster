<svg xmlns="http://www.w3.org/2000/svg" width="315" height="59" viewBox="0 3 315 59" preserveAspectRatio="xMinYMid meet" role="img" aria-labelledby="pmTitle pmDesc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="pmTitle">PromptMaster</title>
  <desc id="pmDesc">PromptMaster – KI. EINFACH. BESSER.</desc>
  <defs>
