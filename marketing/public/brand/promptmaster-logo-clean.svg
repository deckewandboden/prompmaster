      <stop offset="0" stop-color="#22d7f2"/>
      <stop offset="0.55" stop-color="#39a8ff"/>
      <stop offset="1" stop-color="#6a7cff"/>
    </linearGradient>
    <linearGradient id="pmPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a23cff"/>
