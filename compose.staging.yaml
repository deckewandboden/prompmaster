services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["127.0.0.1:8025:8025"]
    networks: [app]
    restart: unless-stopped
  web:
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
      - backup_status:/var/run/promptmaster-backup:ro
    depends_on:
      mailpit: {condition: service_started}
  worker:
    volumes: [./backend:/app]
  beat:
    volumes: [./backend:/app]

  backup:
    environment:
      RESTIC_REPOSITORY: /backup-repo
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    volumes:
      - backup_status:/status
      - staging_backup_repo:/backup-repo

volumes:
  staging_backup_repo:
