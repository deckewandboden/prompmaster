name: PROMPTFINISHER Voucher Fast Acceptance
on:
  pull_request:
    paths:
      - "backend/apps/vouchers/**"
      - "backend/apps/orders/**"
      - "backend/apps/payments/services.py"
      - "backend/apps/companies/portal.py"
      - "backend/apps/core/views.py"
      - "backend/apps/core/admin_urls.py"
      - "backend/config/**"
      - "backend/templates/ns_admin/voucher*"
      - "backend/templates/portal/voucher*"
      - "marketing/src/content.js"
      - "marketing/src/main.js"
      - "marketing/src/locale.js"
      - ".github/workflows/voucher-fast-acceptance.yml"
  workflow_dispatch:
jobs:
  vouchers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: promptmaster
          POSTGRES_USER: promptmaster
          POSTGRES_PASSWORD: testpass1234567890
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U promptmaster -d promptmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      DJANGO_SECRET_KEY: ci-only-voucher-secret-20261114-over-32
      APP_ENCRYPTION_KEY: 3fDltyLLocPcNedSN3wwVTiyNlFCsVyTcdi-pP-WiJY=
      POSTGRES_DB: promptmaster
      POSTGRES_USER: promptmaster
      POSTGRES_PASSWORD: testpass1234567890
      POSTGRES_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: "0"
      SESSION_COOKIE_SECURE: "0"
      CSRF_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check additive migration
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Voucher business, RBAC and price tests
        working-directory: backend
        run: python manage.py test apps.vouchers.tests --verbosity 2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Marketing localization regression
        working-directory: marketing
        run: |
          npm ci
          npm test
