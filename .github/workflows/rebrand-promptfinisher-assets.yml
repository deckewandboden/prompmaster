name: PROMPTFINISHER asset path migration

on:
  push:
    branches:
      - rebrand/promptfinisher-2026-10-03

permissions:
  contents: write

jobs:
  migrate-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Rename product asset paths
        run: python scripts/rebrand_promptfinisher_assets.py
      - name: Verify no obsolete active path remains
        run: |
          if git ls-files -z | tr '\0' '\n' | grep -vi '^archive/' | grep -i 'promptmaster'; then
            echo "Obsolete active promptmaster path remains"
            exit 1
          fi
      - name: Verify whitespace
        run: git diff --check
      - name: Commit generated asset rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rename product assets to PROMPTFINISHER [asset-rebrand]"
          git push origin HEAD:${GITHUB_REF_NAME}
