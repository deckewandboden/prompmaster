name: PROMPTFINISHER Full Dependency Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-security-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Audit all marketing dependencies including build toolchain
        working-directory: marketing
        run: |
          npm ci
          # Audit the complete locked dependency graph rather than npm's
          # platform-pruned node_modules tree. Native optional bindings are
          # intentionally pruned by npm ci on Linux and can otherwise make the
          # legacy quick-audit endpoint reject an otherwise valid lockfile.
          npm audit --package-lock-only --audit-level=high


  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Build deployable PROMPTFINISHER images
        run: |
          set -Eeuo pipefail
          docker build -t promptfinisher-web:ci .
          docker build -f Dockerfile.caddy -t promptfinisher-caddy:ci .
          docker build -f Dockerfile.postgres -t promptfinisher-postgres:ci .
          docker build -f Dockerfile.redis -t promptfinisher-redis:ci .
          docker build -t promptfinisher-backup:ci ./backup

      - name: Scan actual production container root filesystems for fixable high and critical CVEs
        run: |
          set -Eeuo pipefail
          images=(
            "promptfinisher-web:ci"
            "promptfinisher-caddy:ci"
            "promptfinisher-backup:ci"
            "promptfinisher-postgres:ci"
            "promptfinisher-redis:ci"
            "prom/prometheus:v3.13.3"
            "prom/node-exporter:v1.12.1"
            "ghcr.io/google/cadvisor:v0.60.5"
            "prometheuscommunity/postgres-exporter:v0.20.1"
          )

          workdir="$(mktemp -d)"
          cleanup() {
            rm -rf "$workdir"
          }
          trap cleanup EXIT

          for image in "${images[@]}"; do
            echo "============================================================"
            echo "TRIVY ROOTFS GATE: $image"
            echo "============================================================"

            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"

            safe_name="$(printf '%s' "$image" | tr '/:' '__')"
            rootfs="$workdir/$safe_name"
            mkdir -p "$rootfs"

            cid="$(docker create "$image")"
            docker export "$cid" | tar -C "$rootfs" -xf -
            docker rm "$cid" >/dev/null

            trivy rootfs \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --skip-files '**/*.spdx' \
              --skip-files '**/*.spdx.json' \
              --skip-files '**/*.cdx' \
              --skip-files '**/*.cdx.json' \
              --config="" \
              --ignorefile="" \
              --exit-code 1 \
              --timeout 10m \
              "$rootfs"

            rm -rf "$rootfs"
          done
