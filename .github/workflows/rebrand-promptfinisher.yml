name: PROMPTFINISHER one-time rebrand migration

on:
  push:
    branches:
      - rebrand/promptfinisher-2026-10-03

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply product rename
        run: python scripts/rebrand_promptfinisher.py

      - name: Enforce active branding
        run: python scripts/validate_brand.py

      - name: Git whitespace check
        run: git diff --check

      - name: Commit generated rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Rebrand product to PROMPTFINISHER [rebrand-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
