name: PROMPTFINISHER temporary full Pro field translation
on:
  push:
    branches: [feat/promptfinisher-all-product-fields-i18n-20261011]
    paths: [.github/workflows/expand-all-pro-fields-i18n.yml]
permissions:
  contents: write
jobs:
  translate-visible-fields:
    if: github.repository == 'deckewandboden/prompmaster'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARGOS_DEVICE_TYPE: cpu
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promptfinisher-all-product-fields-i18n-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Translate 194-task dynamic Pro fields through offline language models
        run: |
          set -Eeuo pipefail
          python -m pip install "argostranslate>=1.9,<2.0"
          python scripts/generate_product_ui_locales.py
      - name: Check complete ten-language coverage and immutable Golden Masters
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          source=json.loads(Path('product/i18n/free_pro_visible_strings.json').read_text(encoding='utf-8'))
          javascript=Path('backend/static/js/promptfinisher_product_i18n.20261011.js').read_text(encoding='utf-8')
          pat='(  const TEXT=)({.*?})(;' + chr(10) + '  const language = )'
          match=re.search(pat,javascript,re.S)
          assert match, 'No translated catalog'
          texts=json.loads(match[2])
          assert len(source['terms'])>=1300
          for key in source['terms']:
              assert key in texts,key
              for lang in ('en','es','pt','tr','ru','pl','fr','it','nl'):
                  assert texts[key].get(lang),(key,lang)
          print('FULL PRO FIELD LOCALE COVERAGE',len(source['terms']),'labels')
          PY
          python scripts/verify_golden_extraction.py
      - name: Remove temporary workflow and update exact manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/expand-all-pro-fields-i18n.yml
          python scripts/generate_file_manifest.py
          python3 -c "from pathlib import Path; p=Path('docs/COMPLETE_FILE_INVENTORY.md'); p.write_text(p.read_text(encoding='utf-8').rstrip(chr(10))+chr(10),encoding='utf-8')"
          git add -- .github/workflows/expand-all-pro-fields-i18n.yml \
            backend/static/js/promptfinisher_product_i18n.20261011.js \
            product/i18n/free_pro_visible_strings.json \
            docs/FREE_PRO_I18N_DRAFT_REPORT.md \
            FILE_MANIFEST.tsv MANIFEST.json docs/COMPLETE_FILE_INVENTORY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "i18n: add 798 dynamic Pro task field labels to all nine translations"
          git push origin HEAD:feat/promptfinisher-all-product-fields-i18n-20261011
