name: PROMPTFINISHER Release Safety Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promptfinisher-release-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python and Bash syntax
        run: |
          python -m py_compile scripts/staging_readiness.py scripts/test_staging_readiness.py scripts/test_go_live.py scripts/test_release_from_github.py scripts/test_bootstrap_github_release.py scripts/offline_recovery_drill.py scripts/test_offline_recovery_drill.py scripts/offline_backup_go_live_gate.py scripts/test_offline_backup_go_live_gate.py
          bash -n scripts/go_live.sh scripts/release_from_github.sh scripts/bootstrap_github_release.sh scripts/runtime_validate.sh
          python -m py_compile scripts/test_runtime_monitor_ports.py

      - name: Validate complete Free and Pro language dictionaries
        run: python -m unittest discover -s scripts -p 'test_product_locale_coverage.py' -v

      - name: Verify public legal page translations and immutable legal originals
        run: python -m unittest discover -s scripts -p 'test_public_legal_i18n.py' -v

      - name: Test staging isolation positive and negative cases
        run: python -m unittest discover -s scripts -p 'test_staging_readiness.py' -v

      - name: Verify actual Docker monitor port isolation guard with negative cases
        run: python -m unittest discover -s scripts -p 'test_runtime_monitor_ports.py' -v

      - name: Test safe production activation and all approval guards
        run: python -m unittest discover -s scripts -p 'test_go_live.py' -v

      - name: Test one-command GitHub release and rejection paths
        run: python -m unittest discover -s scripts -p 'test_release_from_github.py' -v

      - name: Test public GitHub bootstrap, local binary rescue and branch refusal
        run: python -m unittest discover -s scripts -p 'test_bootstrap_github_release.py' -v

      - name: Test offline recovery archive GPG and production-host rejection
        run: python -m unittest discover -s scripts -p 'test_offline_recovery_drill.py' -v

      - name: Test offline release exception with 19 guarded cases
        run: python -m unittest discover -s scripts -p 'test_offline_backup_go_live_gate.py' -v

      - name: Ensure normal CI is not bypassed
        run: |
          grep -q 'scripts/deploy.sh' scripts/go_live.sh
          grep -q -- '--require-go-live' scripts/go_live.sh
          grep -q 'PM_STAGING_ACCEPTED_SHA' scripts/go_live.sh
          grep -q 'NO_CHANGES_MADE=YES' scripts/staging_readiness.py
