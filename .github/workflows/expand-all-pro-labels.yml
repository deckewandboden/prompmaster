name: PROMPTFINISHER temporary complete Pro field translations
on:
  push:
    branches: [feat/promptfinisher-full-catalog-labels-20261011]
    paths: [.github/workflows/expand-all-pro-labels.yml]
permissions:
  contents: write
jobs:
  translate:
    if: github.repository == 'deckewandboden/prompmaster'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      ARGOS_DEVICE_TYPE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promptfinisher-full-catalog-labels-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extend UI dictionary with remaining database task labels
        run: |
          set -Eeuo pipefail
          python -m pip install "argostranslate>=1.9,<2"
          python scripts/generate_product_ui_locales.py
      - name: Verify every catalog task field has nine nonempty target entries
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('product/i18n/free_pro_visible_strings.json').read_text(encoding='utf-8'))
          text=Path('backend/static/js/promptfinisher_product_i18n.20261011.js').read_text(encoding='utf-8')
          m=re.search('(  const TEXT=)({.*?})(;' + chr(10) + '  const language = )',text,re.S)
          assert m
          translated=json.loads(m[2])
          assert len(data['terms'])>=1400,len(data['terms'])
          locales=('en','es','pt','tr','ru','pl','fr','it','nl')
          for key in data['terms']:
              assert key in translated,key
              for code in locales:
                  assert translated[key].get(code),(key,code)
          print('PASS',len(data['terms']),'Free/Pro dynamic labels across',len(locales),'locales')
          PY
          python scripts/verify_golden_extraction.py
      - name: Commit translated label inventory and remove temporary workflow
        run: |
          set -Eeuo pipefail
          rm .github/workflows/expand-all-pro-labels.yml
          python scripts/generate_file_manifest.py
          python -c "from pathlib import Path; p=Path('docs/COMPLETE_FILE_INVENTORY.md'); p.write_text(p.read_text(encoding='utf-8').rstrip(chr(10))+chr(10),encoding='utf-8')"
          git add -- .github/workflows/expand-all-pro-labels.yml \
            backend/static/js/promptfinisher_product_i18n.20261011.js \
            product/i18n/free_pro_visible_strings.json \
            docs/FREE_PRO_I18N_DRAFT_REPORT.md \
            FILE_MANIFEST.tsv MANIFEST.json docs/COMPLETE_FILE_INVENTORY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "i18n(pro): complete nine-language catalog for all task fields"
          git push origin HEAD:feat/promptfinisher-full-catalog-labels-20261011
