name: PROMPTFINISHER temporary response-language runtime refresh
on:
  push:
    branches: [feat/promptfinisher-prompt-response-language-20261011]
    paths: [.github/workflows/refresh-prompt-language-runtime.yml]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'deckewandboden/prompmaster'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promptfinisher-prompt-response-language-20261011
          persist-credentials: true
      - name: Rebuild deterministic Pro runtime and delete one-time action
        run: |
          set -Eeuo pipefail
          rm .github/workflows/refresh-prompt-language-runtime.yml
          python3 scripts/verify_golden_extraction.py
          python3 scripts/build_pro_runtime.py
          python3 scripts/build_pro_runtime.py --check
          python3 scripts/generate_file_manifest.py
          python3 -c "from pathlib import Path; p=Path('docs/COMPLETE_FILE_INVENTORY.md'); p.write_text(p.read_text(encoding='utf-8').rstrip(chr(10))+chr(10),encoding='utf-8')"
          git add -- .github/workflows/refresh-prompt-language-runtime.yml \
            backend/private_assets/promptfinisher_pro_runtime.html \
            FILE_MANIFEST.tsv MANIFEST.json docs/COMPLETE_FILE_INVENTORY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(runtime): rebuild deterministic Pro bridge after locale API integration"
          git push origin HEAD:feat/promptfinisher-prompt-response-language-20261011
