name: PROMPTFINISHER temporary additional locale generation
on:
  push:
    branches:
      - fix/promptfinisher-public-free-and-logo-20261011
    paths:
      - .github/workflows/prepare-additional-locales.yml

permissions:
  contents: write

jobs:
  offline-gettext:
    if: github.repository == 'deckewandboden/prompmaster' && github.ref == 'refs/heads/fix/promptfinisher-public-free-and-logo-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      ARGOS_DEVICE_TYPE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/promptfinisher-public-free-and-logo-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation engine and gettext validator
        run: |
          set -Eeuo pipefail
          python -m pip install "argostranslate>=1.9,<2.0" "polib>=1.2,<2"
          sudo apt-get update -qq
          sudo apt-get install -y gettext
      - name: Translate public UI gettext catalogs locally on runner
        run: |
          set -Eeuo pipefail
          python scripts/generate_additional_locales.py pl fr it nl
          for code in pl fr it nl; do
            msgfmt --check --check-format --statistics -o /dev/null "backend/locale/$code/LC_MESSAGES/django.po"
          done
      - name: Remove one-time workflow and generate exact file inventories
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/prepare-additional-locales.yml
          python scripts/generate_file_manifest.py
          python3 -c "from pathlib import Path; p=Path('docs/COMPLETE_FILE_INVENTORY.md'); p.write_text(p.read_text(encoding='utf-8').rstrip(chr(10))+chr(10),encoding='utf-8')"
          git add -- .github/workflows/prepare-additional-locales.yml \
            backend/locale/pl/LC_MESSAGES/django.po \
            backend/locale/fr/LC_MESSAGES/django.po \
            backend/locale/it/LC_MESSAGES/django.po \
            backend/locale/nl/LC_MESSAGES/django.po \
            FILE_MANIFEST.tsv MANIFEST.json docs/COMPLETE_FILE_INVENTORY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "i18n: generate four draft locale catalogs and regenerate project inventory"
          git push origin HEAD:fix/promptfinisher-public-free-and-logo-20261011
