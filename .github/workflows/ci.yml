name: PromptMaster CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Audit marketing dependencies
        working-directory: marketing
        run: |
          npm ci
          npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: promptmaster
          POSTGRES_USER: promptmaster
          POSTGRES_PASSWORD: testpass1234567890
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U promptmaster -d promptmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only
      APP_ENCRYPTION_KEY: 3fDltyLLocPcNedSN3wwVTiyNlFCsVyTcdi-pP-WiJY=
      POSTGRES_DB: promptmaster
      POSTGRES_USER: promptmaster
      POSTGRES_PASSWORD: testpass1234567890
      POSTGRES_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: 0
      SESSION_COOKIE_SECURE: 0
      CSRF_COOKIE_SECURE: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Python-Abhängigkeiten müssen vor allen Python-Prüfskripten
      # installiert sein. validate_static.py benötigt u. a. PyYAML.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # Marketing muss vor github_preflight.py gebaut werden,
      # da der Preflight Dateien unter marketing/dist/ validiert.
      - name: Marketing tests, lint and build
        working-directory: marketing
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Static repository guards
        run: python scripts/github_preflight.py

      - name: Check migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate and seed
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_defaults
          python manage.py seed_prompt_catalog
          python manage.py seed_faqs

      - name: Prompt platform runtime sanity
        working-directory: backend
        run: python manage.py validate_prompt_runtime

      - name: Django checks and tests
        working-directory: backend
        run: |
          python manage.py check
          python manage.py test --verbosity 2

      - name: Compose configuration
        env:
          CADDY_DOMAIN: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          INITIAL_ADMIN_EMAIL: admin@local.invalid
          INITIAL_ADMIN_PASSWORD: ci-only-admin-password-12345
          RESTIC_REPOSITORY: /tmp/promptmaster-restic
          RESTIC_PASSWORD: ci-only-restic-password-12345
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.staging.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.production.yaml config >/dev/null

      - name: Collect static
        working-directory: backend
        run: python manage.py collectstatic --noinput

      - name: Docker builds
        run: |
          docker build -t promptmaster-ci:${{ github.sha }} .
          docker build -f Dockerfile.caddy -t promptmaster-caddy-ci:${{ github.sha }} .
          docker build -t promptmaster-backup-ci:${{ github.sha }} ./backup

  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Build marketing for repository validation
        working-directory: marketing
        run: |
          npm ci
          npm run build
      - name: Generate isolated staging configuration
        env:
          PM_DOMAIN: localhost
        run: python scripts/prepare_env.py
      - name: Start and validate full stack with production filesystem restrictions
        env:
          PM_VALIDATE_READ_ONLY: '1'
        run: bash scripts/runtime_validate.sh
      - name: Test restore failure propagation and recovery
        run: bash scripts/test_backup_restore.sh
      - name: Container status
        if: always()
        run: docker compose -f compose.yaml -f compose.staging.yaml -f compose.production.yaml ps -a
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.staging.yaml -f compose.production.yaml logs --tail=100
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.staging.yaml -f compose.production.yaml down

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build marketing
        working-directory: marketing
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Pro runtime browser smoke
        run: python scripts/browser_runtime_smoke.py

      - name: Marketing browser smoke
        run: python scripts/browser_marketing_smoke.py
