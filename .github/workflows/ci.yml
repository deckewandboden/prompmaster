name: PromptMaster CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: promptmaster-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: promptmaster
          POSTGRES_USER: promptmaster
          POSTGRES_PASSWORD: testpass1234567890
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U promptmaster -d promptmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only
      APP_ENCRYPTION_KEY: 3fDltyLLocPcNedSN3wwVTiyNlFCsVyTcdi-pP-WiJY=
      POSTGRES_DB: promptmaster
      POSTGRES_USER: promptmaster
      POSTGRES_PASSWORD: testpass1234567890
      POSTGRES_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: 0
      SESSION_COOKIE_SECURE: 0
      CSRF_COOKIE_SECURE: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Python-Abhängigkeiten müssen vor allen Python-Prüfskripten
      # installiert sein. validate_static.py benötigt u. a. PyYAML.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # Marketing muss vor github_preflight.py gebaut werden,
      # da der Preflight Dateien unter marketing/dist/ validiert.
      - name: Marketing tests, lint and build
        working-directory: marketing
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Static repository guards
        run: |
          set -o pipefail
          python scripts/github_preflight.py 2>&1 | tee ci-preflight.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ci-preflight.log
          if-no-files-found: ignore

      - name: Check migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate and seed
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_defaults
          python manage.py seed_prompt_catalog
          python manage.py seed_faqs

      - name: Prompt platform runtime sanity
        working-directory: backend
        run: python manage.py validate_prompt_runtime

      - name: Django checks and tests
        working-directory: backend
        run: |
          python manage.py check
          python manage.py test --verbosity 2

      - name: 100k DataGrid scalability gate
        working-directory: backend
        env:
          RUN_100K_DATAGRID_ACCEPTANCE: '1'
        run: |
          python manage.py test \
            apps.core.tests.DataGrid100kAcceptanceTests.test_100000_rows_paginate_without_unbounded_result_materialization \
            --verbosity 2

      - name: Compose configuration
        env:
          CADDY_DOMAIN: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          INITIAL_ADMIN_EMAIL: admin@local.invalid
          INITIAL_ADMIN_PASSWORD: ci-only-admin-password-12345
          RESTIC_REPOSITORY: /tmp/promptmaster-restic
          RESTIC_PASSWORD: ci-only-restic-password-12345
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.staging.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.production.yaml config >/dev/null

      - name: Collect static
        working-directory: backend
        run: python manage.py collectstatic --noinput

      - name: Docker builds
        run: |
          docker build -t promptmaster-ci:${{ github.sha }} .
          docker build -f Dockerfile.caddy -t promptmaster-caddy-ci:${{ github.sha }} .
          docker build -t promptmaster-backup-ci:${{ github.sha }} ./backup


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Python dependency vulnerability audit
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7,<3"
          pip-audit -r requirements.txt --progress-spinner off 2>&1 | tee security-pip-audit.log

      - name: Marketing production dependency vulnerability audit
        working-directory: marketing
        run: |
          set -o pipefail
          npm ci
          npm audit --audit-level=high 2>&1 | tee ../security-npm-audit.log

      - name: Upload security diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-diagnostics
          path: |
            security-pip-audit.log
            security-npm-audit.log
          if-no-files-found: ignore

  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Clean bootstrap installation
        env:
          PM_DOMAIN: localhost
        run: |
          rm -rf marketing/dist marketing/node_modules
          rm -f .env .bootstrap-credentials
          bash scripts/bootstrap.sh
      - name: Validate full stack with production filesystem restrictions
        env:
          PM_VALIDATE_READ_ONLY: '1'
        run: bash scripts/runtime_validate.sh
      - name: Concurrent HTTP load smoke
        env:
          PM_LOAD_BASE_URL: https://localhost
          PM_LOAD_WORKERS: '32'
          PM_LOAD_REQUESTS: '640'
        run: python3 scripts/http_load_smoke.py
      - name: Test restore failure propagation and recovery
        run: bash scripts/test_backup_restore.sh
      - name: Container status
        if: always()
        run: docker compose -f compose.yaml -f compose.staging.yaml -f compose.production.yaml ps -a
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.staging.yaml -f compose.production.yaml logs --tail=100
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.staging.yaml -f compose.production.yaml down

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: promptmaster
          POSTGRES_USER: promptmaster
          POSTGRES_PASSWORD: testpass1234567890
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U promptmaster -d promptmaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DJANGO_SECRET_KEY: ci-browser-secret-key-ci-browser-secret-key
      APP_ENCRYPTION_KEY: 3fDltyLLocPcNedSN3wwVTiyNlFCsVyTcdi-pP-WiJY=
      POSTGRES_DB: promptmaster
      POSTGRES_USER: promptmaster
      POSTGRES_PASSWORD: testpass1234567890
      POSTGRES_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: 0
      SESSION_COOKIE_SECURE: 0
      CSRF_COOKIE_SECURE: 0
      BACKEND_UI_BROWSER_SMOKE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build marketing
        working-directory: marketing
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "playwright>=1.50,<2" "pillow>=11,<13"
          pip check
          python -m playwright install --with-deps chromium firefox webkit

      - name: Prepare Django browser fixtures
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_defaults
          python manage.py seed_prompt_catalog
          python manage.py seed_faqs
          python manage.py check

      - name: Pro runtime and Django backend browser smoke
        run: |
          set -o pipefail
          python scripts/browser_runtime_smoke.py 2>&1 | tee browser-runtime-smoke.log

      - name: Marketing browser smoke
        run: |
          set -o pipefail
          : > browser-marketing-smoke.log
          for engine in chromium firefox webkit; do
            echo "===== $engine =====" | tee -a browser-marketing-smoke.log
            PM_BROWSER_ENGINE="$engine" python scripts/browser_marketing_smoke.py 2>&1 | tee -a browser-marketing-smoke.log
          done

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            browser-runtime-smoke.log
            browser-marketing-smoke.log
            browser-artifacts/*.png
          if-no-files-found: ignore
