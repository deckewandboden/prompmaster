name: PROMPTFINISHER temporary validated i18n inventory
on:
  push:
    branches: [fix/promptfinisher-public-free-and-logo-20261011]
    paths: [.github/workflows/refresh-validated-i18n.yml]
permissions:
  contents: write
jobs:
  verify-and-refresh:
    if: github.repository == 'deckewandboden/prompmaster'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/promptfinisher-public-free-and-logo-20261011
          persist-credentials: true
      - name: Validate every gettext locale and fix report format
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          python scripts/validate_i18n_contracts.py
          for lang in en es pt tr ru pl fr it nl; do
            msgfmt --check --check-format -o /dev/null "backend/locale/$lang/LC_MESSAGES/django.po"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/FREE_PRO_I18N_DRAFT_REPORT.md')
          p.write_text(p.read_text(encoding='utf-8').replace(chr(92)+'n',chr(10)),encoding='utf-8')
          PY
      - name: Regenerate exact manifest then self-remove
        run: |
          set -Eeuo pipefail
          rm .github/workflows/refresh-validated-i18n.yml
          python scripts/generate_file_manifest.py
          python3 -c "from pathlib import Path; p=Path('docs/COMPLETE_FILE_INVENTORY.md'); p.write_text(p.read_text(encoding='utf-8').rstrip(chr(10))+chr(10),encoding='utf-8')"
          git add -- .github/workflows/refresh-validated-i18n.yml \
            backend/locale/pl/LC_MESSAGES/django.po \
            backend/locale/fr/LC_MESSAGES/django.po \
            backend/locale/it/LC_MESSAGES/django.po \
            backend/locale/nl/LC_MESSAGES/django.po \
            backend/apps/core/tests_i18n_admin.py \
            scripts/generate_additional_locales.py \
            scripts/generate_product_ui_locales.py \
            scripts/validate_i18n_contracts.py \
            scripts/github_preflight.py \
            docs/FREE_PRO_I18N_DRAFT_REPORT.md \
            FILE_MANIFEST.tsv MANIFEST.json docs/COMPLETE_FILE_INVENTORY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(i18n): finalize safe placeholder-preserving catalogs and tracked inventory"
          git push origin HEAD:fix/promptfinisher-public-free-and-logo-20261011
