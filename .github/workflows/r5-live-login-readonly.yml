name: PROMPTFINISHER Live Login Design Read-only
on:
  pull_request:
    paths:
      - scripts/audit_live_login_design.py
      - .github/workflows/r5-live-login-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-live-login-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-live-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate audit syntax
        run: python -m py_compile scripts/audit_live_login_design.py
      - name: Unit test hashed CSS recognition, login actions and translations
        run: python -m unittest discover -s scripts -p test_live_login_design.py -v
      - name: Install Chromium for GET-only live Free audit
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Unit test strict first-party route audit
        run: python -m unittest discover -s scripts -p test_public_routes_readonly.py -v
      - name: GET-only public, legal, protected and sensitive-route audit
        run: python scripts/audit_public_routes_readonly.py
      - name: GET-only audit against actual deployed login (all ten locales)
        run: python scripts/audit_live_login_design.py

      - name: Read-only public Free V2 browser audit - all ten locales
        if: always()
        run: python scripts/audit_live_free_locales.py
      - name: Upload live browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-live-login-free-readonly
          path: |
            browser-artifacts/live-locale/
            browser-artifacts/public-route-check/
          if-no-files-found: ignore
          retention-days: 14
