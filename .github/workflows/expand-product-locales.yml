name: PROMPTFINISHER temporary product locales expansion
on:
  push:
    branches:
      - fix/promptfinisher-public-free-and-logo-20261011
    paths:
      - .github/workflows/expand-product-locales.yml

permissions:
  contents: write

jobs:
  translate-product-ui:
    if: github.repository == 'deckewandboden/prompmaster' && github.ref == 'refs/heads/fix/promptfinisher-public-free-and-logo-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      ARGOS_DEVICE_TYPE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/promptfinisher-public-free-and-logo-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Translate presentation text with offline models
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install "argostranslate>=1.9,<2.0"
          python scripts/generate_product_ui_locales.py
      - name: Assert all ten product locales and preserve Golden Masters
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          src=json.loads((root/'product/i18n/free_pro_visible_strings.json').read_text())
          js=(root/'backend/static/js/promptfinisher_product_i18n.20261011.js').read_text()
          m=re.search('(  const TEXT=)({.*?})(;' + chr(10) + '  const language = )',js,re.S)
          assert m,'Translations missing from delivered browser JS'
          mapping=json.loads(m[2])
          for key in src['terms']:
              assert key in mapping, key
              for code in ('en','es','pt','tr','ru','pl','fr','it','nl'):
                  assert mapping[key].get(code), (code,key)
          assert 'const language =' in js
          print('Product UI locale catalog:',len(src['terms']),'source terms, all 9 target languages')
          PY
          python scripts/verify_golden_extraction.py
      - name: Finalize exact inventory and remove one-time action
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/expand-product-locales.yml
          python scripts/generate_file_manifest.py
          python3 -c "from pathlib import Path; p=Path('docs/COMPLETE_FILE_INVENTORY.md'); p.write_text(p.read_text(encoding='utf-8').rstrip(chr(10))+chr(10),encoding='utf-8')"
          git add -- .github/workflows/expand-product-locales.yml \
            backend/static/js/promptfinisher_product_i18n.20261011.js \
            docs/FREE_PRO_I18N_DRAFT_REPORT.md \
            FILE_MANIFEST.tsv MANIFEST.json docs/COMPLETE_FILE_INVENTORY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "i18n: expand Free/Pro presentation catalog across ten supported languages"
          git push origin HEAD:fix/promptfinisher-public-free-and-logo-20261011
